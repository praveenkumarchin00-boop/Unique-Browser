name: Build Windows Browser
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript
        run: npm run check
      - name: Package portable Windows application
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify portable EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/win-unpacked/Unique Browser.exe')) { throw 'Portable executable missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: Unique-Browser-Portable-Windows-x64
          path: dist/win-unpacked/**
          retention-days: 14
